name: profile

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main, feat/perfil-2026]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # imagens da última execução: se o cartão falhar, o antigo fica no ar
      - run: |
          mkdir -p last gen
          git fetch --depth=1 origin output && git archive FETCH_HEAD | tar -x -C last || true

      - run: node .github/diag.mjs
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      # PROFILE_TOKEN: token só de leitura, para os repos privados entrarem nas linguagens e na contagem de repos.
      # Sem ele, cai no GITHUB_TOKEN e o cartão conta só o que é público (os totais já incluem os privados).
      - run: node .github/atividade.mjs gen
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # só estas imagens vão para a output: o que sair da lista some de lá na próxima execução
      - run: |
          mkdir -p dist
          cp assets/*.svg dist/
          for f in atividade-dark.svg atividade-light.svg; do
            cp "gen/$f" dist/ 2>/dev/null || cp "last/$f" dist/ 2>/dev/null || echo "::warning::$f não foi gerado"
          done

      # publica o dist/ na branch output, de onde o README lê as imagens
      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
