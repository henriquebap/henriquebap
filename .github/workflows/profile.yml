name: profile

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main, feat/perfil-2026]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # imagens da última execução: gerador que falhar deixa a imagem antiga no ar
      - run: |
          mkdir -p last
          git fetch --depth=1 origin output && git archive FETCH_HEAD | tar -x -C last || true

      # PROFILE_TOKEN: token só de leitura, para os totais e as linguagens contarem os repos privados.
      # Sem ele, cai no GITHUB_TOKEN e os cartões mostram só o que é público.
      - run: node .github/anos.mjs anos.svg
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - uses: vn7n24fzkq/github-profile-summary-cards@58ec032e39377dd38329bdc1db70074fe74fbb17 # v0.12.1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3
          THEME: tokyonight
          ANIMATION: draw
          NAME: Henrique Baptista
          AUTO_PUSH: false

      # só estas imagens vão para a output: o que sair da lista some de lá na próxima execução
      - run: |
          mkdir -p dist
          for f in anos.svg profile-summary-card-output/tokyonight/2-most-commit-language.svg profile-summary-card-output/tokyonight/4-productive-time.svg; do
            cp "$f" dist/ 2>/dev/null || cp "last/$(basename "$f")" dist/ 2>/dev/null || echo "::warning::$(basename "$f") não foi gerado"
          done

      # publica o dist/ na branch output, de onde o README lê as imagens
      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
