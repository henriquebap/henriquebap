<svg xmlns="http://www.w3.org/2000/svg" width="840" height="124" viewBox="0 0 840 124"><style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif }
@keyframes subir { from { opacity: 0; transform: translateY(8px) } }
@keyframes tracar { to { stroke-dashoffset: 0 } }
.nome { font-size: 44px; font-weight: 600; letter-spacing: -.8px; fill: #f0f6fc; animation: subir .8s cubic-bezier(.2,.7,.3,1) both }
.traco { stroke: #58a6ff; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 76; stroke-dashoffset: 76; animation: tracar .8s .45s cubic-bezier(.4,0,.2,1) forwards }
.cargo { animation: subir .8s .7s cubic-bezier(.2,.7,.3,1) both }
@media (prefers-reduced-motion: reduce) { * { animation: none !important } .traco { stroke-dashoffset: 0 } }
</style><text class="nome" x="0" y="50">Henrique Baptista</text>
<line class="traco" x1="3" y1="72" x2="77" y2="72"/>
<text class="cargo" x="0" y="108"><tspan style="font-size:20px;fill:#9198a1">AI Engineer</tspan><tspan dx="12" style="font-size:20px;fill:#3d444d">/</tspan><tspan dx="12" style="font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:15px;fill:#58a6ff">LLM-as-Judge · Evals · ASR · Product Engineer</tspan></text></svg>